<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="30" y="35" font-size="20" font-weight="bold" fill="#2D3142">Paleta de cores — Respira+</text>

  <g>
    <rect x="30" y="60" width="150" height="120" rx="10" fill="#5FB3B3"/>
